name: Firmware and host tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/host -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build and test
        run: |
          cmake --build build/host --parallel
          ctest --test-dir build/host --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    strategy:
      fail-fast: false
      matrix:
        board: [esp32c6_rgb8, generic_esp32c6, generic_esp32c3, generic_esp32s3, generic_esp32]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          unset IDF_TARGET
          idf.py -B "build/${{ matrix.board }}" -D "BTH_BOARD=${{ matrix.board }}" -D BTH_WITH_MATTER=OFF build
