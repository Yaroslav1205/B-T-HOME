name: Firmware release candidate

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4
      - name: Check packaging
        run: python3 -m unittest discover -s tests -p test_package_firmware.py
      - name: Host tests
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cmake -S tests/host -B build/host
          cmake --build build/host --parallel
          ctest --test-dir build/host --output-on-failure
      - name: Build ESP32-C6 Zigbee and Wi-Fi
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          unset IDF_TARGET
          idf.py -B build/esp32c6_rgb8 -D BTH_BOARD=esp32c6_rgb8 -D BTH_WITH_MATTER=OFF build
      - name: Prepare release candidate
        run: python3 scripts/package_firmware.py --output build/firmware-package
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -c "import json, os; m=json.load(open('build/firmware-package/manifest.json')); assert os.environ['RELEASE_TAG']=='v'+m['version'], 'Tag must match firmware version'"
      - uses: actions/upload-artifact@v4
        with:
          name: bt-home-esp32c6_rgb8-release-candidate
          path: build/firmware-package/
          if-no-files-found: error
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            build/firmware-package/*.bin
            build/firmware-package/manifest.json
            build/firmware-package/SHA256SUMS
